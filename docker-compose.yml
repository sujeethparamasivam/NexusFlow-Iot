version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nexusflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: nexusflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexusflow-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexusflow-server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:password@mongodb:27017/nexusflow?authSource=admin
      DB_NAME: nexusflow
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: replace-with-a-container-secret
    depends_on:
      - mongodb
    networks:
      - nexusflow-network
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexusflow-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    networks:
      - nexusflow-network
volumes:
  mongodb_data:

networks:
  nexusflow-network:
    driver: bridge
