version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nexusflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: nexusflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexusflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusflow-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/nexusflow
      PORT: 5000
      LOG_LEVEL: debug
    depends_on:
      - mongodb
    networks:
      - nexusflow-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusflow-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - nexusflow-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  nexusflow-network:
    driver: bridge
